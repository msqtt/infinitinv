org.gradle.jvmargs=-Xmx4G
# This host has no working IPv6 (no global address, no route) but the
# resolver still returns AAAA records. Force IPv4 so libgit2/Gradle
# don't hang trying to reach them.
systemProp.java.net.preferIPv4Stack=true

# Toolchain discovery. The nix store paths are pinned to the JDKs
# currently in the profile; they change when nixpkgs is updated.
# Regenerate with:
#   nix eval --raw nixpkgs#openjdk17.home
#   nix eval --raw nixpkgs#openjdk8.home
#
# NOTE: nixpkgs' openjdk8 nests the real JDK home at <store>/lib/openjdk
# (that is where lib/tools.jar lives) — pointing at the store root
# makes Gradle fail with "Could not find tools.jar".
org.gradle.java.installations.paths=/nix/store/q6zvjlnhypm88y989l8fq0hjqrz9agda-openjdk-17.0.20+2,/nix/store/hlrdhpxzxac7s8mmizqgwm0p1c0mk5df-openjdk-8u502-b01/lib/openjdk
org.gradle.java.installations.auto-download=false

