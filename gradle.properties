org.gradle.jvmargs=-Xmx4G
# This host has no working IPv6 (no global address, no route) but the
# resolver still returns AAAA records. Force IPv4 so libgit2/Gradle
# don't hang trying to reach them.
systemProp.java.net.preferIPv4Stack=true

# Toolchain discovery.
#
# The 1.12.2 target needs a JDK 8 toolchain; 1.17+ needs JDK 17. Gradle
# finds local JDKs automatically, but NixOS keeps its JDKs in the store, so
# point Gradle at them explicitly. Do NOT hardcode store paths here — they
# change on every nixpkgs update and they are machine specific. Put them in
# your user level gradle.properties instead:
#
#   ~/.gradle/gradle.properties
#     org.gradle.java.installations.paths=<jdk17 home>,<jdk8 home>
#
# On NixOS the JDK 8 home is <store>/lib/openjdk (not the store root) —
# that is where lib/tools.jar lives, and pointing at the store root makes
# Gradle fail with "Could not find tools.jar".
#
# Regenerate the paths with:
#   nix eval --raw nixpkgs#openjdk17.home
#   nix eval --raw nixpkgs#openjdk8.home
org.gradle.java.installations.auto-download=false

