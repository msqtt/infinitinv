name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (toolchain for the 1.12.2 target)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - id: jdk8
        run: echo "path=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 (drives Gradle, target for 1.17+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew :1.12.2:build \
            -Porg.gradle.java.installations.paths="${{ steps.jdk8.outputs.path }},$JAVA_HOME"

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: infinitinv-1.12.2
          path: versions/1.12.2/build/libs/1.12.2.jar
          if-no-files-found: error
